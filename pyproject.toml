[project]
name = "lewm"
version = "0.1.0"
description = "LeWorldModel (JEPA) training on ManiSkill demos"
requires-python = ">=3.12,<3.13"
# pins mirror the known-good maniskill-ml/venv
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
    "numpy==2.5.4",
    "h5py==3.16.0",
    "tqdm==4.70.1",
    "tyro==1.0.16",
    "einops==0.8.2",
    "stable-pretraining==0.1.8",
    "transformers==5.20.2",
    "mani_skill==3.0.0b22",
    "lightning==2.6.6",
    "wandb==0.31.0",
    "python-dotenv==1.2.4",
    "diffusers==0.42.1",
    "scikit-learn==1.9.1",
]

[tool.uv]
# not an installable package: run from examples/baselines as `python -m lewm.train`
package = false
environments = ["sys_platform == 'linux'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
